name: Mac visual check

# Builds Pkmn Life Remote on the xcode-27 runner (macOS 27, Xcode 27.1, as every Mac job), runs it against a mock bar
# in each state (shown, hovered, tucked, peeking, pinned, both Settings tabs; light and dark) and uploads the
# screenshots as the "mac-screens" artifact. Start it from the Actions tab (Run workflow); it also runs on pull requests
# that touch the Mac app.

on:
  workflow_dispatch:
  pull_request:
    paths: ["mac/**", "apps/pkmn-life/src/appmeta/settings.json", "apps/pkmn-life/src/presets.ts"]

concurrency:
  group: mac-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screens:
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode
        run: mac/PkmnLifeRemote/Tools/ci/select-xcode.sh
      - name: Test
        working-directory: mac/PkmnLifeRemote
        run: swift test
      - name: Capture
        working-directory: mac/PkmnLifeRemote
        run: Tools/screenshots.sh screens
      - name: Summary
        if: always()
        working-directory: mac/PkmnLifeRemote
        run: |
          {
            echo "## Pkmn Life Remote screens"
            echo
            echo "Download the **mac-screens** artifact. Files:"
            echo
            find screens -name '*.png' | sort | sed 's/^/- /'
          } >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mac-screens
          path: mac/PkmnLifeRemote/screens/
