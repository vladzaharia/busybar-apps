# Releases everything in the repository under one version: each BUSY Bar app's package and its simulator, the shared
# packages, and Pkmn Life Remote, the Mac app (built on the xcode-27 runner, signed with Developer ID, notarized and
# stapled). They go in one GitHub Release with SHA256SUMS.txt, and the simulators and the effects gallery go to GitHub
# Pages. Runs for a pushed vX.Y.Z tag, or by hand: on a v* tag, or from the default branch with a version, which leaves
# the files on the run's page and makes no GitHub Release.
# The Mac app's job runs once its signing is set up (the MAC_TEAM_ID variable; until then the release goes out without
# it), in the `release` environment, which holds every secret. RELEASE.md covers cutting a release; mac/RELEASE.md the
# Mac app's one-time setup and its secrets.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version X.Y.Z (needed when running from the default branch; a v* tag sets it)
        type: string
        required: false

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  # The exact Xcode build a release ships from: the `xcode-27` image's Xcode 27.1, the build the app is developed with.
  # The mac job fails on any other. When the image moves to a new build, see CI pass with it, then set the
  # MAC_RELEASE_XCODE_BUILD repository variable (mac/RELEASE.md, Runner and Xcode).
  MAC_RELEASE_XCODE_BUILD: ${{ vars.MAC_RELEASE_XCODE_BUILD || '27A9275' }}
  NSUnbufferedIO: "YES"

jobs:
  prepare:
    name: Version and notes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read # the GitHub Pages address, for the notes
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
      tag: ${{ steps.version.outputs.tag }}
      is_tag: ${{ steps.version.outputs.is_tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      pages_url: ${{ steps.notes.outputs.pages_url }}
    steps:
      # The whole history and every tag (annotated ones with their messages), for the checks and notes below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # A v* tag must point at a commit on the default branch (pushed, or picked in a manual run); a manual run from a
      # branch must be from the default branch. Nothing else releases.
      - name: Check the ref
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ! scripts/release/check-ref.sh --event "$EVENT" --ref "$REF" --sha "$GITHUB_SHA" \
              --default-branch "$DEFAULT_BRANCH" 2> "$RUNNER_TEMP/ref.txt"; then
            echo "::error::$(cat "$RUNNER_TEMP/ref.txt")"
            exit 1
          fi
      - name: Version
        id: version
        env:
          REF: ${{ github.ref }}
          VERSION: ${{ inputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          args=(--ref "$REF" --run-number "$RUN_NUMBER")
          if [[ -n "$VERSION" ]]; then args+=(--version "$VERSION"); fi
          scripts/release/version.sh "${args[@]}" | tee -a "$GITHUB_OUTPUT"
      # The Mac app is listed when its job will run; the simulators are linked once GitHub Pages is on (RELEASE.md,
      # Setup), which also lets the pages job run.
      - name: Release notes
        id: notes
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          MAC_TEAM_ID: ${{ vars.MAC_TEAM_ID }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p notes
          ref="$GITHUB_SHA"
          if [[ -n "$TAG" ]]; then ref="refs/tags/$TAG"; fi
          args=(--version "$VERSION" --ref "$ref")
          if [[ -n "$MAC_TEAM_ID" ]]; then args+=(--mac); fi
          if site="$(gh api "repos/$REPO/pages" --jq .html_url 2>/dev/null)" && [[ -n "$site" ]]; then
            args+=(--site-url "$site")
            echo "pages_url=$site" >> "$GITHUB_OUTPUT"
          fi
          scripts/release/release-notes.sh "${args[@]}" > notes/release.md
          cat notes/release.md >> "$GITHUB_STEP_SUMMARY"
      # Artifacts belong to the run, not the attempt: "Re-run all jobs" replaces this one.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: notes/
          retention-days: 30
          if-no-files-found: error
          overwrite: true

  build:
    name: Apps, simulators and packages
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # build provenance: the Sigstore certificate for the attestation
      attestations: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      # Every package.json and app manifest takes the release's version first (in this checkout only).
      - name: Build
        run: scripts/release/build.sh --version "$VERSION" --out dist/release --site dist/site
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/release/SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist/release/
          retention-days: 30
          if-no-files-found: error
          overwrite: true
      # The GitHub Pages site (the pages job publishes it for a tag).
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/site/
          retention-days: 30

  # Skipped until the Mac app's signing is set up (mac/RELEASE.md, One-time setup), which sets MAC_TEAM_ID.
  mac:
    name: Developer ID, notarized
    needs: prepare
    if: vars.MAC_TEAM_ID != ''
    runs-on: xcode-27
    timeout-minutes: 90
    environment: release
    permissions:
      contents: read
      id-token: write # build provenance: the Sigstore certificate for the attestation
      attestations: write
    defaults:
      run:
        working-directory: mac/PkmnLifeRemote
    env:
      MAC_TEAM_ID: ${{ vars.MAC_TEAM_ID }}
      VERSION: ${{ needs.prepare.outputs.version }}
      BUILD: ${{ needs.prepare.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Only whether each secret is set reaches this step, not its value.
      - name: Check the configuration
        env:
          HAVE_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID != '' }}
          HAVE_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID != '' }}
          HAVE_ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 != '' }}
          HAVE_DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 != '' }}
          HAVE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD != '' }}
        run: |
          missing=()
          [[ "$MAC_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]] || missing+=("the MAC_TEAM_ID repository variable")
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64 DEVELOPER_ID_P12_BASE64 DEVELOPER_ID_P12_PASSWORD; do
            have="HAVE_$name"
            [[ "${!have}" == true ]] || missing+=("the $name secret in the release environment")
          done
          if (( ${#missing[@]} )); then
            for item in "${missing[@]}"; do echo "::error::Set $item (mac/PkmnLifeRemote/Tools/ci/setup-github.sh)."; done
            exit 1
          fi
      - name: Select Xcode
        run: Tools/ci/select-xcode.sh --expect-build "$MAC_RELEASE_XCODE_BUILD"
      - name: Test
        run: swift test
      # Compiles with no secret on the runner.
      - name: Build
        run: ./build-app.sh --version "$VERSION" --build "$BUILD"
      # Secrets: each step that needs one gets it from the environment and runs inside `Tools/ci/secrets.sh run`,
      # which writes it for that command only and deletes it after. The .p12 becomes a temporary keychain for this step
      # alone, after everything has compiled.
      - name: Sign with Developer ID
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: Tools/ci/secrets.sh run -- ./build-app.sh --sign-only --developer-id
      # Waits at most 45 minutes for Apple, and puts the submission ID in the run summary.
      - name: Notarize, staple, and package
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          Tools/ci/secrets.sh run -- Tools/ci/package-mac.sh --app "dist/Pkmn Life Remote.app" --version "$VERSION" \
            --build "$BUILD" --output dist/release --notarize
      # Signed SLSA build provenance for every file in SHA256SUMS.txt, tied to this workflow, commit, and run
      # (RELEASE.md, Verifying a download). GitHub offers attestations for private repositories only on Enterprise
      # Cloud, so while this repository is private the step is skipped.
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: mac/PkmnLifeRemote/dist/release/SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-release
          path: mac/PkmnLifeRemote/dist/release/
          retention-days: 30
          if-no-files-found: error
          overwrite: true
      # A backstop: every secret is already gone unless a step was killed.
      - name: Remove secrets
        if: always()
        run: Tools/ci/secrets.sh cleanup

  # A tag's GitHub Release: created as a draft with the files, then published. Holds no Apple secret. Waits for the Mac
  # app when its job runs, and goes without it when that job is skipped (not when it fails).
  release:
    name: GitHub Release
    needs: [prepare, build, mac]
    if: >-
      ${{ !cancelled() && needs.prepare.outputs.is_tag == 'true' && needs.build.result == 'success'
      && (needs.mac.result == 'success' || needs.mac.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.mac.result == 'success'
        with:
          name: mac-release
          path: mac-dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes
      # Each job's files against its own checksums, then the Mac app's joined to the rest: one SHA256SUMS.txt.
      - name: Verify checksums
        run: |
          (cd dist && sha256sum -c SHA256SUMS.txt)
          if [[ -d mac-dist ]]; then
            (cd mac-dist && sha256sum -c SHA256SUMS.txt)
            find mac-dist -maxdepth 1 -type f ! -name SHA256SUMS.txt -exec cp {} dist/ \;
            cat mac-dist/SHA256SUMS.txt >> dist/SHA256SUMS.txt
            (cd dist && sha256sum -c SHA256SUMS.txt)
          fi
      # A re-run updates its own draft (stale files go), but never a published release.
      - name: Create or update the draft release
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          url="$(scripts/release/github-release.sh draft --repo "$REPO" --tag "$TAG" \
            --title "busybar-apps $VERSION" --notes-file notes/release.md --prerelease "$PRERELEASE" dist/*)"
          { echo "### GitHub Release (draft)"; echo "$url"; } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish it
        run: |
          url="$(scripts/release/github-release.sh publish --repo "$REPO" --tag "$TAG")"
          { echo "### GitHub Release"; echo "$url"; } >> "$GITHUB_STEP_SUMMARY"

  # The released simulators and the effects gallery on GitHub Pages, once the release is out: not for prereleases, and
  # only while GitHub Pages is on (RELEASE.md, Setup).
  pages:
    name: GitHub Pages
    needs: [prepare, release]
    if: needs.prepare.outputs.prerelease != 'true' && needs.prepare.outputs.pages_url != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
