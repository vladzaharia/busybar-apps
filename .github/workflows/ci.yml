name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Simulators
        run: for app in apps/*/; do (cd "$app" && pnpm sim); done
      - uses: actions/upload-artifact@v4
        with:
          name: apps
          path: |
            apps/*/dist/*.tgz
            apps/*/dist/sim/

  mac-kit:
    # The Mac app's tests (PkmnLifeRemoteKit) also run on Linux, which is quicker to get than a Mac runner. They check
    # the Mac's copy of Pkmn Life's entries and settings against apps/pkmn-life.
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v5
      - name: Test
        working-directory: mac/PkmnLifeRemote
        run: swift test

  mac:
    # Pkmn Life Remote, the Mac app, signed ad hoc (no certificate; release.yml makes the Developer ID builds).
    # Xcode 27.1 (Swift 6.4) on the xcode-27 image, as every Mac job. The zip keeps the app's permissions and signature
    # (an artifact alone doesn't).
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mac/PkmnLifeRemote
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode
        run: Tools/ci/select-xcode.sh
      - name: Test
        run: swift test
      - name: Build the app
        run: ./build-app.sh
      - name: Check the app
        run: Tools/ci/check-app.sh --app "dist/Pkmn Life Remote.app" --kind adhoc
      - name: Zip the app
        working-directory: mac/PkmnLifeRemote/dist
        run: ditto -c -k --keepParent "Pkmn Life Remote.app" PkmnLifeRemote.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pkmn-life-remote
          path: mac/PkmnLifeRemote/dist/PkmnLifeRemote.zip

  lint:
    # The workflows (actionlint, which also runs shellcheck on every `run:` block) and the shell scripts. The Mac
    # app's scripts and the release's are held to every shellcheck rule; the repository's others to warnings and errors.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/actionlint"
          tar -xzf "$archive" -C "$RUNNER_TEMP/actionlint" actionlint
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"
      - name: actionlint
        run: actionlint
      - name: shellcheck
        run: |
          shellcheck mac/PkmnLifeRemote/build-app.sh mac/PkmnLifeRemote/Tools/*.sh mac/PkmnLifeRemote/Tools/ci/*.sh \
            scripts/release/*.sh
          shellcheck --severity=warning scripts/*.sh .claude/hooks/*.sh
