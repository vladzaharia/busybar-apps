name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Simulators
        run: for app in apps/*/; do (cd "$app" && pnpm sim); done
      - uses: actions/upload-artifact@v4
        with:
          name: apps
          path: |
            apps/*/dist/*.tgz
            apps/*/dist/sim/

  mac:
    # Pkmn Life Remote, the Mac app (macOS 26, Swift 6.2). The zip keeps the app's permissions and signature (an
    # artifact alone doesn't).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Test
        working-directory: mac/PkmnLifeRemote
        run: swift test
      - name: Build the app
        working-directory: mac/PkmnLifeRemote
        run: ./build-app.sh
      - name: Zip the app
        working-directory: mac/PkmnLifeRemote/dist
        run: ditto -c -k --keepParent "Pkmn Life Remote.app" PkmnLifeRemote.zip
      - uses: actions/upload-artifact@v4
        with:
          name: pkmn-life-remote
          path: mac/PkmnLifeRemote/dist/PkmnLifeRemote.zip
