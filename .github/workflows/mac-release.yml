# Releases Pkmn Life Remote, the Mac app: built on the xcode-27 runner, signed with Developer ID (hardened runtime,
# secure timestamp), notarized and stapled, zipped with SHA256SUMS.txt, and attached to a GitHub Release. Runs for a
# pushed remote-v* tag (the repository's other apps aren't released here), or by hand: on a remote-v* tag, or from the
# default branch with a version, which leaves the files on the run's page and makes no GitHub Release.
# The signing job runs in the `release` environment, which holds every secret. mac/RELEASE.md covers the one-time
# setup, the secrets, and how to cut a release.
name: Mac release

on:
  push:
    tags: ["remote-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version X.Y.Z (needed when running from the default branch; a remote-v* tag sets it)
        type: string
        required: false

permissions: {}

concurrency:
  group: mac-release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  # The exact Xcode build a release ships from: the `xcode-27` image's Xcode 27.1, the build the app is developed with.
  # The mac job fails on any other. When the image moves to a new build, see CI pass with it, then set the
  # MAC_RELEASE_XCODE_BUILD repository variable (mac/RELEASE.md, Runner and Xcode).
  MAC_RELEASE_XCODE_BUILD: ${{ vars.MAC_RELEASE_XCODE_BUILD || '27A9275' }}
  NSUnbufferedIO: "YES"

jobs:
  prepare:
    name: Version and notes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
      tag: ${{ steps.version.outputs.tag }}
      is_tag: ${{ steps.version.outputs.is_tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      # The whole history and every tag (annotated ones with their messages), for the checks and notes below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # A remote-v* tag must point at a commit on the default branch (pushed, or picked in a manual run); a manual run
      # from a branch must be from the default branch. Nothing else releases.
      - name: Check the ref
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ! mac/PkmnLifeRemote/Tools/ci/check-ref.sh --event "$EVENT" --ref "$REF" --sha "$GITHUB_SHA" \
              --default-branch "$DEFAULT_BRANCH" 2> "$RUNNER_TEMP/ref.txt"; then
            echo "::error::$(cat "$RUNNER_TEMP/ref.txt")"
            exit 1
          fi
      - name: Version
        id: version
        env:
          REF: ${{ github.ref }}
          VERSION: ${{ inputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          args=(--ref "$REF" --run-number "$RUN_NUMBER")
          if [[ -n "$VERSION" ]]; then args+=(--version "$VERSION"); fi
          mac/PkmnLifeRemote/Tools/ci/version.sh "${args[@]}" | tee -a "$GITHUB_OUTPUT"
      - name: Release notes
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir -p notes
          ref="$GITHUB_SHA"
          if [[ -n "$TAG" ]]; then ref="refs/tags/$TAG"; fi
          mac/PkmnLifeRemote/Tools/ci/release-notes.sh --ref "$ref" > notes/release.md
          cat notes/release.md >> "$GITHUB_STEP_SUMMARY"
      # Artifacts belong to the run, not the attempt: "Re-run all jobs" replaces this one.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: notes/
          retention-days: 30
          if-no-files-found: error
          overwrite: true

  mac:
    name: Developer ID, notarized
    needs: prepare
    runs-on: xcode-27
    timeout-minutes: 90
    environment: release
    permissions:
      contents: read
      id-token: write # build provenance: the Sigstore certificate for the attestation
      attestations: write
    defaults:
      run:
        working-directory: mac/PkmnLifeRemote
    env:
      MAC_TEAM_ID: ${{ vars.MAC_TEAM_ID }}
      VERSION: ${{ needs.prepare.outputs.version }}
      BUILD: ${{ needs.prepare.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Only whether each secret is set reaches this step, not its value.
      - name: Check the configuration
        env:
          HAVE_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID != '' }}
          HAVE_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID != '' }}
          HAVE_ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 != '' }}
          HAVE_DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 != '' }}
          HAVE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD != '' }}
        run: |
          missing=()
          [[ "$MAC_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]] || missing+=("the MAC_TEAM_ID repository variable")
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64 DEVELOPER_ID_P12_BASE64 DEVELOPER_ID_P12_PASSWORD; do
            have="HAVE_$name"
            [[ "${!have}" == true ]] || missing+=("the $name secret in the release environment")
          done
          if (( ${#missing[@]} )); then
            for item in "${missing[@]}"; do echo "::error::Set $item (mac/PkmnLifeRemote/Tools/ci/setup-github.sh)."; done
            exit 1
          fi
      - name: Select Xcode
        run: Tools/ci/select-xcode.sh --expect-build "$MAC_RELEASE_XCODE_BUILD"
      - name: Test
        run: swift test
      # Compiles with no secret on the runner.
      - name: Build
        run: ./build-app.sh --version "$VERSION" --build "$BUILD"
      # Secrets: each step that needs one gets it from the environment and runs inside `Tools/ci/secrets.sh run`,
      # which writes it for that command only and deletes it after. The .p12 becomes a temporary keychain for this step
      # alone, after everything has compiled.
      - name: Sign with Developer ID
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: Tools/ci/secrets.sh run -- ./build-app.sh --sign-only --developer-id
      # Waits at most 45 minutes for Apple, and puts the submission ID in the run summary.
      - name: Notarize, staple, and package
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          Tools/ci/secrets.sh run -- Tools/ci/package-mac.sh --app "dist/Pkmn Life Remote.app" --version "$VERSION" \
            --build "$BUILD" --output dist/release --notarize
      # Signed SLSA build provenance for every file in SHA256SUMS.txt, tied to this workflow, commit, and run
      # (mac/RELEASE.md, Verifying a download). GitHub offers attestations for private repositories only on Enterprise
      # Cloud, so while this repository is private the step is skipped.
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: mac/PkmnLifeRemote/dist/release/SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-release
          path: mac/PkmnLifeRemote/dist/release/
          retention-days: 30
          if-no-files-found: error
          overwrite: true
      # A backstop: every secret is already gone unless a step was killed.
      - name: Remove secrets
        if: always()
        run: Tools/ci/secrets.sh cleanup

  # A tag's GitHub Release: created as a draft with the files, then published. Holds no Apple secret.
  release:
    name: GitHub Release
    needs: [prepare, mac]
    if: needs.prepare.outputs.is_tag == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mac-release
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes
      - name: Verify checksums
        working-directory: dist
        run: sha256sum -c SHA256SUMS.txt
      # A re-run updates its own draft (stale files go), but never a published release.
      - name: Create or update the draft release
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          url="$(mac/PkmnLifeRemote/Tools/ci/github-release.sh draft --repo "$REPO" --tag "$TAG" \
            --title "Pkmn Life Remote $VERSION" --notes-file notes/release.md --prerelease "$PRERELEASE" dist/*)"
          { echo "### GitHub Release (draft)"; echo "$url"; } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish it
        run: |
          url="$(mac/PkmnLifeRemote/Tools/ci/github-release.sh publish --repo "$REPO" --tag "$TAG")"
          { echo "### GitHub Release"; echo "$url"; } >> "$GITHUB_STEP_SUMMARY"
